name: Generate Beyond the Blink Visuals

on:
  workflow_dispatch:

  repository_dispatch:
    types: [generate_visuals]

permissions:
  contents: read

jobs:
  generate-visuals:
    runs-on: ubuntu-latest

    steps:
      - name: Generate all 21 visuals
        env:
          VISUAL_KEY: ${{ secrets.BEYOND_BLINK_UPLOAD_KEY }}
        run: |
          set -e

          for short in 1 2 3 4 5 6 7
          do
            for visual in 1 2 3
            do
              echo ""
              echo "=============================="
              echo "Generating Short #${short} Visual ${visual}/3"
              echo "=============================="

             STATUS=$(curl \
                --silent \
                --output /dev/null \
                --write-out "%{http_code}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/sarvandesign/beyond-the-blink-video/contents/visual-${short}-${visual}.jpg")
              
              if [ "$STATUS" = "200" ]; then
                echo "✅ Visual already exists. Skipping."
                continue
              fi

              RESPONSE=$(curl \
                --fail-with-body \
                --silent \
                --show-error \
                --get \
                --data-urlencode "key=${VISUAL_KEY}" \
                --data-urlencode "chat=6160845469" \
                --data-urlencode "short=${short}" \
                --data-urlencode "visual=${visual}" \
                "https://beyond-the-blink.beyondtheblink-creator.workers.dev/visual-one")

              echo "$RESPONSE"

              echo "✅ Short #${short} Visual ${visual} completed."
            done
          done

          echo ""
          echo "========================================"
          echo "🎬 ALL 21 VISUALS ARE READY"
          echo "========================================"
