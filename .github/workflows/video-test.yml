name: Video Test

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Download repository files
        uses: actions/checkout@v4

      - name: Decode AI voice
        run: |
          jq -r '.audio' script-1.mp3 | base64 -d > script-1.wav

      - name: Create video with AI voice
        run: |
          ffmpeg \
            -loop 1 -t 5 -i scene1.jpg \
            -loop 1 -t 5 -i scene2.jpg \
            -loop 1 -t 5 -i scene3.jpg \
            -i script-1.wav \
            -filter_complex "
              [0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30[v1];
              [1:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30[v2];
              [2:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30[v3];
              [v1][v2][v3]concat=n=3:v=1:a=0[outv]
            " \
            -map "[outv]" \
            -map 3:a \
            -c:v libx264 \
            -c:a aac \
            -b:a 192k \
            -pix_fmt yuv420p \
            -r 30 \
            -shortest \
            -movflags +faststart \
            test-short.mp4

      - name: Save complete test Short
        uses: actions/upload-artifact@v4
        with:
          name: beyond-the-blink-complete-short
          path: test-short.mp4
