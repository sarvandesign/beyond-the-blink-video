name: Build Beyond the Blink Shorts

on:
  workflow_dispatch:

  repository_dispatch:
    types: [build_short]

permissions:
  contents: write

jobs:
  build-short:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download project files
        uses: actions/checkout@v4

      - name: Check source files
        run: |
          echo "Checking available Short assets..."
          find . -maxdepth 1 -type f \
            \( -name "visual-*.jpg" -o -name "voice-*.wav" \) \
            -print | sort

      - name: Build Shorts
        run: |
          set -e

          for i in 1 2 3 4 5 6 7
          do
            echo ""
            echo "=============================="
            echo "Building Short #$i"
            echo "=============================="

            if [ ! -f "visual-$i-1.jpg" ] || \
               [ ! -f "visual-$i-2.jpg" ] || \
               [ ! -f "visual-$i-3.jpg" ] || \
               [ ! -f "voice-$i.wav" ]
            then
              echo "Assets for Short #$i are not ready yet."
              continue
            fi

            DURATION=$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of csv=p=0 \
              "voice-$i.wav")

            SCENE_DURATION=$(awk \
              "BEGIN {print $DURATION / 3}")

            ffmpeg -y \
              -loop 1 -t "$SCENE_DURATION" -i "visual-$i-1.jpg" \
              -loop 1 -t "$SCENE_DURATION" -i "visual-$i-2.jpg" \
              -loop 1 -t "$SCENE_DURATION" -i "visual-$i-3.jpg" \
              -i "voice-$i.wav" \
              -filter_complex "
                [0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30[v1];
                [1:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30[v2];
                [2:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30[v3];
                [v1][v2][v3]concat=n=3:v=1:a=0[outv]
              " \
              -map "[outv]" \
              -map 3:a:0 \
              -c:v libx264 \
              -preset medium \
              -crf 20 \
              -pix_fmt yuv420p \
              -r 30 \
              -c:a aac \
              -b:a 192k \
              -ar 44100 \
              -ac 2 \
              -shortest \
              -movflags +faststart \
              "beyond-the-blink-short-$i.mp4"

            echo "Short #$i finished."
          done

      - name: Verify finished Shorts
        run: |
          set -e

          for i in 1 2 3 4 5 6 7
          do
            if [ ! -f "beyond-the-blink-short-$i.mp4" ]; then
              echo "❌ Missing Short #$i"
              exit 1
            fi

            echo "✅ Short #$i ready"
          done

      - name: Save finished Shorts
        run: |
          git config user.name "Beyond the Blink Bot"
          git config user.email "beyondtheblink.creator@gmail.com"

          git add beyond-the-blink-short-*.mp4

          git commit \
            -m "Add finished Beyond the Blink Shorts" \
            || echo "No changes to commit"

          git push

      - name: Upload and schedule Shorts
        env:
          UPLOAD_KEY: ${{ secrets.BEYOND_BLINK_UPLOAD_KEY }}
        run: |
          set -e

          for i in 1 2 3 4 5 6 7
          do
            echo ""
            echo "=============================="
            echo "Uploading Short #$i"
            echo "=============================="

            RESPONSE=$(curl \
              --fail-with-body \
              --silent \
              --show-error \
              "https://beyond-the-blink.beyondtheblink-creator.workers.dev/upload?key=${UPLOAD_KEY}&i=${i}")

            echo "$RESPONSE"

            sleep 5
          done

      - name: Save Short artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beyond-the-blink-shorts
          path: beyond-the-blink-short-*.mp4
          if-no-files-found: error
