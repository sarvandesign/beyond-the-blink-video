name: Build Short #1

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download repository files
        uses: actions/checkout@v4

      - name: Create Short #1
        run: |
          ffmpeg -y \
            -loop 1 -t 5 -i visual-1.jpg \
            -loop 1 -t 5 -i visual-2.jpg \
            -loop 1 -t 5 -i visual-3.jpg \
            -i voice-1.wav \
            -filter_complex "
              [0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30[v1];
              [1:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30[v2];
              [2:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30[v3];
              [v1][v2][v3]concat=n=3:v=1:a=0[outv]
            " \
            -map "[outv]" \
            -map 3:a:0 \
            -c:v libx264 \
            -c:a aac \
            -b:a 192k \
            -pix_fmt yuv420p \
            -r 30 \
            -shortest \
            -movflags +faststart \
            beyond-the-blink-short-1.mp4

      - name: Save finished Short
        uses: actions/upload-artifact@v4
        with:
          name: beyond-the-blink-short-1
          path: beyond-the-blink-short-1.mp4
