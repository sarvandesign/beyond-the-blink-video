name: Build Beyond the Blink Short

on:
  workflow_dispatch:

  repository_dispatch:
    types: [build_short]

permissions:
  contents: write

jobs:
  build-short:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download project files
        uses: actions/checkout@v4

      - name: Check source files
        run: |
          ls -lh visual-1.jpg visual-2.jpg visual-3.jpg voice-1.wav

      - name: Get voice duration
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 voice-1.wav)
          SCENE_DURATION=$(awk "BEGIN {print $DURATION / 3}")
          echo "Voice duration: $DURATION seconds"
          echo "Each visual duration: $SCENE_DURATION seconds"
          echo "SCENE_DURATION=$SCENE_DURATION" >> $GITHUB_ENV

      - name: Create final Short
        run: |
          ffmpeg -y \
            -loop 1 -t "$SCENE_DURATION" -i visual-1.jpg \
            -loop 1 -t "$SCENE_DURATION" -i visual-2.jpg \
            -loop 1 -t "$SCENE_DURATION" -i visual-3.jpg \
            -i voice-1.wav \
            -filter_complex "
              [0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30[v1];
              [1:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30[v2];
              [2:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30[v3];
              [v1][v2][v3]concat=n=3:v=1:a=0[outv]
            " \
            -map "[outv]" \
            -map 3:a:0 \
            -c:v libx264 \
            -preset medium \
            -crf 20 \
            -pix_fmt yuv420p \
            -r 30 \
            -c:a aac \
            -b:a 192k \
            -ar 44100 \
            -ac 2 \
            -shortest \
            -movflags +faststart \
            beyond-the-blink-short-1.mp4

      - name: Save final Short as GitHub file
        run: |
          git config user.name "Beyond the Blink Bot"
          git config user.email "beyondtheblink.creator@gmail.com"
          git add beyond-the-blink-short-1.mp4
          git commit -m "Add finished Short #1" || echo "No changes to commit"
          git push

      - name: Upload finished Short to YouTube
        env:
          YOUTUBE_UPLOAD_KEY: ${{ secrets.YOUTUBE_UPLOAD_KEY }}
        run: |
          sleep 10

          curl --fail-with-body \
            --get \
            --data-urlencode "key=$YOUTUBE_UPLOAD_KEY" \
            "https://beyond-the-blink.beyondtheblink-creator.workers.dev/upload"

      - name: Save final Short artifact
        uses: actions/upload-artifact@v4
        with:
          name: beyond-the-blink-short-1
          path: beyond-the-blink-short-1.mp4
