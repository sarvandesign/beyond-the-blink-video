name: Video Test

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create test video
        run: ffmpeg -f lavfi -i testsrc2=size=1080x1920:rate=30:duration=5 -c:v libx264 -pix_fmt yuv420p test-short.mp4

      - name: Save test video
        uses: actions/upload-artifact@v4
        with:
          name: beyond-the-blink-test-video
          path: test-short.mp4
