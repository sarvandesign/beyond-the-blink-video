name: Video Test

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download repository files
        uses: actions/checkout@v4

      - name: Create video from AI image
        run: |
          ffmpeg -loop 1 -i scene1.jpg \
            -t 5 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -r 30 \
            test-short.mp4

      - name: Save test video
        uses: actions/upload-artifact@v4
        with:
          name: beyond-the-blink-test-video
          path: test-short.mp4
