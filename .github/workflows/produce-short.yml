name: Make Beyond the Blink Short

# Started automatically when you tap Approve in Telegram
# (repository_dispatch "produce_short"), or manually from the Actions tab.
#
# One Short per run:
#   0. Tamil script     → Worker /script-one
#   1. Tamil voice      → Worker /voice-one  → voice-N.wav
#   2. 3 AI visuals     → Worker /visual-one → visual-N-1/2/3.jpg
#   3. Video (FFmpeg)   → beyond-the-blink-short-N.mp4, with Tamil captions
#   4. YouTube          → Worker /upload (scheduled 7 pm IST),
#                         which then starts the next approved idea
#
# from = "voice"  skips step 0 (script already written)
# from = "upload" skips steps 0–3 and only retries the upload.

on:
  repository_dispatch:
    types: [produce_short]

  workflow_dispatch:
    inputs:
      short:
        description: "Short number (1-7)"
        required: true
        default: "1"
      from:
        description: "Start from"
        required: true
        default: script
        type: choice
        options:
          - script
          - voice
          - upload

permissions:
  contents: write

concurrency:
  group: make-short
  cancel-in-progress: false

env:
  WORKER: https://beyond-the-blink.beyondtheblink-creator.workers.dev
  CHAT: "6160845469"
  SHORT: ${{ github.event.client_payload.short || inputs.short }}
  FROM: ${{ github.event.client_payload.from || inputs.from || 'script' }}
  WORKER_KEY: ${{ secrets.BEYOND_BLINK_UPLOAD_KEY }}

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check request
        run: |
          case "$SHORT" in
            1|2|3|4|5|6|7) ;;
            *) echo "❌ Invalid Short number: '$SHORT'"; exit 1 ;;
          esac

          case "$FROM" in
            script|voice|upload) ;;
            *) echo "❌ Invalid start step: '$FROM'"; exit 1 ;;
          esac

          echo "🎬 Making Short #$SHORT (starting from: $FROM)"

          cat > "$RUNNER_TEMP/worker.sh" <<'EOF'
          # call_worker <attempts> <path> [--data-urlencode name=value ...]
          call_worker() {
            local attempts="$1" path="$2" attempt response
            shift 2
            for attempt in $(seq 1 "$attempts"); do
              if response=$(curl --fail-with-body --silent --show-error \
                  --max-time 290 --get \
                  --data-urlencode "key=${WORKER_KEY}" \
                  --data-urlencode "chat=${CHAT}" \
                  "$@" "${WORKER}${path}"); then
                echo "$response"
                return 0
              fi
              echo "$response"
              echo "⚠️ ${path} attempt ${attempt}/${attempts} failed."
              if [ "$attempt" -lt "$attempts" ]; then
                sleep 20
              fi
            done
            return 1
          }
          EOF

      - name: 0. Tamil script
        if: env.FROM == 'script'
        run: |
          source "$RUNNER_TEMP/worker.sh"
          call_worker 2 /script-one --data-urlencode "short=${SHORT}"

      - name: 1. Tamil voice
        if: env.FROM != 'upload'
        run: |
          source "$RUNNER_TEMP/worker.sh"
          call_worker 2 /voice-one --data-urlencode "short=${SHORT}"

      - name: 2. AI visuals
        if: env.FROM != 'upload'
        run: |
          source "$RUNNER_TEMP/worker.sh"
          for visual in 1 2 3; do
            echo "Visual ${visual}/3"
            call_worker 2 /visual-one \
              --data-urlencode "short=${SHORT}" \
              --data-urlencode "visual=${visual}"
          done

      # Checks out main as it is NOW, so the voice and visuals the
      # Worker just committed are included.
      - name: Download latest files
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install FFmpeg and Tamil font
        if: env.FROM != 'upload'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core

          if [ -z "$(fc-list ':family=Noto Sans Tamil' family)" ]; then
            echo "Noto Sans Tamil not in apt fonts — fetching it from Google Fonts"
            (
              git clone -q --depth 1 --filter=blob:none --sparse https://github.com/google/fonts "$RUNNER_TEMP/gfonts" &&
              git -C "$RUNNER_TEMP/gfonts" sparse-checkout set ofl/notosanstamil &&
              mkdir -p ~/.fonts &&
              cp "$RUNNER_TEMP"/gfonts/ofl/notosanstamil/*.ttf ~/.fonts/ &&
              fc-cache -f
            ) || echo "⚠️ Could not fetch the Tamil font."
          fi

          echo "Tamil fonts: $(fc-list :lang=ta family | sort -u | tr '\n' ' ')"

      - name: 3. Build video
        if: env.FROM != 'upload'
        run: |
          VOICE="voice-${SHORT}.wav"
          OUT="beyond-the-blink-short-${SHORT}.mp4"

          for f in "visual-${SHORT}-1.jpg" "visual-${SHORT}-2.jpg" "visual-${SHORT}-3.jpg" "$VOICE"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing $f"
              exit 1
            fi
          done

          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VOICE")
          FRAMES=$(awk -v d="$DURATION" 'BEGIN { print int(d * 30 / 3) + 2 }')
          echo "Voice: ${DURATION}s → ${FRAMES} frames per scene"

          # ---- Tamil captions (skipped with a warning if anything fails) ----
          cat > "$RUNNER_TEMP/captions.py" <<'PYEOF'
          # Builds Tamil captions (ASS) for one Short.
          #
          #   python3 captions.py voice.wav script.txt captions.ass
          #
          # Timing: the narration is split into sentences, and each sentence
          # boundary is snapped to a real pause in the voice (ffmpeg
          # silencedetect). Inside a sentence, short 2–3 word captions share
          # the time in proportion to their length.

          import re
          import subprocess
          import sys

          voice, script_path, out_path = sys.argv[1:4]

          text = open(script_path, encoding="utf-8").read()
          text = re.sub(r"\([^)]*\)|\[[^\]]*\]", " ", text)
          text = re.sub(r"[{}\\]", "", text)
          text = re.sub(r"[ \t]+", " ", text).strip()

          if not text:
              sys.exit("Script text is empty")

          duration = float(
              subprocess.check_output(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                   "-of", "csv=p=0", voice]
              ).decode().strip()
          )

          log = subprocess.run(
              ["ffmpeg", "-hide_banner", "-nostats", "-i", voice,
               "-af", "silencedetect=noise=-30dB:d=0.2", "-f", "null", "-"],
              capture_output=True, text=True,
          ).stderr

          starts = [float(x) for x in re.findall(r"silence_start: (-?[\d.]+)", log)]
          ends = [float(x) for x in re.findall(r"silence_end: ([\d.]+)", log)]
          silences = []
          for i, s in enumerate(starts):
              e = ends[i] if i < len(ends) else duration
              silences.append([max(0.0, s), min(duration, e)])

          speech_start = 0.0
          speech_end = duration
          if silences and silences[0][0] <= 0.05:
              speech_start = silences.pop(0)[1]
          if silences and silences[-1][1] >= duration - 0.05:
              speech_end = silences.pop()[0]
          if speech_end - speech_start < 1:
              speech_start, speech_end = 0.0, duration

          # --- sentences -------------------------------------------------------
          sentences = [
              s.strip()
              for s in re.split(r"(?<=[.!?।])\s+|\n+", text)
              if s.strip()
          ]


          def weight(s):
              # Spoken length ≈ letters and vowel signs (no spaces/punctuation)
              return max(1, len(re.sub(r"[\s.,!?।:;\"'“”‘’—–-]", "", s)))


          weights = [weight(s) for s in sentences]
          total = sum(weights)
          span = speech_end - speech_start

          # Estimated boundary times between sentences
          estimates = []
          acc = 0
          for w in weights[:-1]:
              acc += w
              estimates.append(speech_start + span * acc / total)

          # Snap each boundary to the nearest unused pause
          avg_sentence = span / len(sentences)
          window = max(1.5, 0.45 * avg_sentence)
          used = set()
          bounds = []          # (end of sentence k, start of sentence k+1)
          previous = speech_start
          for t in estimates:
              best = None
              for i, (s, e) in enumerate(silences):
                  mid = (s + e) / 2
                  if i in used or mid <= previous + 0.3:
                      continue
                  if abs(mid - t) <= window and (best is None or abs(mid - t) < abs((silences[best][0] + silences[best][1]) / 2 - t)):
                      best = i
              if best is None:
                  bounds.append((t, t))
                  previous = t
              else:
                  used.add(best)
                  s, e = silences[best]
                  bounds.append((s, e))
                  previous = e

          sentence_times = []
          start = speech_start
          for i in range(len(sentences)):
              end = bounds[i][0] if i < len(bounds) else speech_end
              sentence_times.append((start, max(end, start + 0.4)))
              if i < len(bounds):
                  start = bounds[i][1]

          # --- short captions inside each sentence ------------------------------
          MAX_WORDS = 3
          MAX_CHARS = 22


          def chunks(sentence):
              words = sentence.split()
              out, cur = [], []
              for word in words:
                  trial = " ".join(cur + [word])
                  if cur and (len(cur) >= MAX_WORDS or len(trial) > MAX_CHARS):
                      out.append(" ".join(cur))
                      cur = [word]
                  else:
                      cur.append(word)
              if cur:
                  out.append(" ".join(cur))
              # avoid a lonely last word
              if (len(out) > 1 and len(out[-1].split()) == 1
                      and len(out[-2].split()) < MAX_WORDS
                      and len(out[-2]) + 1 + len(out[-1]) <= MAX_CHARS + 4):
                  last = out.pop()
                  out[-1] = out[-1] + " " + last
              return out


          def ts(seconds):
              seconds = max(0.0, seconds)
              h = int(seconds // 3600)
              m = int(seconds % 3600 // 60)
              s = seconds % 60
              return f"{h}:{m:02d}:{s:05.2f}"


          events = []
          for sentence, (s_start, s_end) in zip(sentences, sentence_times):
              parts = chunks(sentence)
              part_weights = [weight(p) for p in parts]
              part_total = sum(part_weights)
              t = s_start
              for part, w in zip(parts, part_weights):
                  d = (s_end - s_start) * w / part_total
                  events.append((t, t + d, part))
                  t += d

          # Keep each caption on screen until the next one appears (no flicker
          # during short pauses), but not across long pauses.
          for i in range(len(events) - 1):
              a_start, a_end, a_text = events[i]
              b_start = events[i + 1][0]
              if b_start - a_end < 0.6:
                  events[i] = (a_start, b_start, a_text)

          header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 0
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Caption,Noto Sans Tamil,74,&H00FFFFFF,&H000000FF,&H00000000,&H96000000,-1,0,0,0,100,100,0,0,1,6,3,2,100,100,560,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """

          with open(out_path, "w", encoding="utf-8") as f:
              f.write(header)
              for start, end, part in events:
                  pop = r"{\fscx92\fscy92\t(0,90,\fscx100\fscy100)}"
                  f.write(f"Dialogue: 0,{ts(start)},{ts(end)},Caption,,0,0,0,,{pop}{part}\n")

          print(
              f"Captions: {len(sentences)} sentences, {len(events)} captions, "
              f"{len(used)}/{len(bounds)} sentence breaks matched to pauses"
          )
          PYEOF

          SUBS=""
          if curl --fail --silent --show-error --max-time 60 --get \
                --data-urlencode "key=${WORKER_KEY}" \
                --data-urlencode "short=${SHORT}" \
                -o "$RUNNER_TEMP/script.txt" "${WORKER}/script-text" \
             && [ -n "$(fc-list :lang=ta family)" ] \
             && python3 "$RUNNER_TEMP/captions.py" "$VOICE" "$RUNNER_TEMP/script.txt" captions.ass; then
            SUBS=",ass=captions.ass:shaping=complex"
          else
            echo "⚠️ Captions skipped — building the video without them."
          fi

          # Fill a 9:16 frame (rendered at 2x for smooth motion),
          # then slowly zoom: in, out, in.
          COVER="scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840"
          PAN="x=iw/2-(iw/zoom/2):y=ih/2-(ih/zoom/2):d=${FRAMES}:s=1080x1920:fps=30"

          ffmpeg -y -hide_banner -loglevel error -stats \
            -i "visual-${SHORT}-1.jpg" \
            -i "visual-${SHORT}-2.jpg" \
            -i "visual-${SHORT}-3.jpg" \
            -i "$VOICE" \
            -filter_complex "
              [0:v]${COVER},zoompan=z='1+0.12*on/${FRAMES}':${PAN},setsar=1[v1];
              [1:v]${COVER},zoompan=z='1.12-0.12*on/${FRAMES}':${PAN},setsar=1[v2];
              [2:v]${COVER},zoompan=z='1+0.15*on/${FRAMES}':${PAN},setsar=1[v3];
              [v1][v2][v3]concat=n=3:v=1:a=0${SUBS},format=yuv420p[outv]
            " \
            -map "[outv]" \
            -map 3:a:0 \
            -c:v libx264 -preset medium -crf 21 -r 30 \
            -c:a aac -b:a 192k -ar 44100 -ac 2 \
            -shortest \
            -movflags +faststart \
            "$OUT"

          SIZE=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$OUT")
          LENGTH=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUT")
          echo "✅ $OUT — ${SIZE}, ${LENGTH}s, $(du -h "$OUT" | cut -f1)"

          if [ "$SIZE" != "1080x1920" ]; then
            echo "❌ Unexpected video size: $SIZE"
            exit 1
          fi

      - name: Save video to GitHub
        if: env.FROM != 'upload'
        run: |
          git config user.name "Beyond the Blink Bot"
          git config user.email "beyondtheblink.creator@gmail.com"

          git add "beyond-the-blink-short-${SHORT}.mp4"
          git commit -m "Add finished Short #${SHORT}" || echo "No changes to commit"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "⚠️ Push failed — syncing with main and retrying..."
            git pull --rebase origin main
          done

          echo "❌ Could not save the video to GitHub."
          exit 1

      - name: 4. Upload and schedule on YouTube
        run: |
          source "$RUNNER_TEMP/worker.sh"

          if [ ! -f "beyond-the-blink-short-${SHORT}.mp4" ]; then
            echo "❌ beyond-the-blink-short-${SHORT}.mp4 is not in the repo."
            exit 1
          fi

          REF=$(git rev-parse HEAD)
          call_worker 1 /upload \
            --data-urlencode "i=${SHORT}" \
            --data-urlencode "ref=${REF}"

      - name: Tell Telegram it stopped
        if: failure()
        run: |
          source "$RUNNER_TEMP/worker.sh" || exit 0
          call_worker 1 /notify \
            --data-urlencode "short=${SHORT}" \
            --data-urlencode "status=failed" \
            --data-urlencode "text=⛔ Short ${SHORT} stopped (see the error above). Automatic production is paused — send /make to retry. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true
